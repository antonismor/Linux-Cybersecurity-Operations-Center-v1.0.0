server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/cybersecurity-ops/tls/server.crt;
    ssl_certificate_key /etc/cybersecurity-ops/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Cybersecurity Operations Center";
    auth_basic_user_file /etc/nginx/.cybersecurity_ops_htpasswd;

    client_max_body_size 20m;

    location /api/agent/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /downloads/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
